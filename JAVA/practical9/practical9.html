<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Theme Settings</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #e8edf1;
      color: #2d3a45;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease, color 0.3s ease;
    }

    body.dark-theme {
      background: #1a1d22;
      color: #edf4ff;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .settings-panel {
      width: min(72vw, 760px);
      min-height: 330px;
      background: rgba(233, 236, 239, 0.9);
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 18px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.04);
      padding: 30px 32px 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(2.4rem, 3vw, 4rem);
      font-weight: 700;
      color: rgba(38, 47, 58, 0.88);
      letter-spacing: -0.04em;
    }

    .label-text {
      margin-bottom: 18px;
      font-size: 18px;
      color: rgba(53, 63, 73, 0.92);
    }

    select {
      width: 185px;
      height: 36px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.22);
      color: #2f3d4d;
      font-size: 18px;
      padding: 0 36px 0 14px;
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, #5d6670 50%),
        linear-gradient(135deg, #5d6670 50%, transparent 50%);
      background-position: calc(100% - 18px) calc(50% - 3px), calc(100% - 12px) calc(50% - 3px);
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      outline: none;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .button-row {
      margin-top: 26px;
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
    }

    .action-btn {
      min-width: 220px;
      height: 42px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      color: rgba(39, 48, 59, 0.9);
      background: rgba(190, 198, 206, 0.72);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35);
      transition: transform 0.12s ease, filter 0.2s ease;
      font-weight: 500;
    }

    .action-btn:hover {
      filter: brightness(0.98);
    }

    .action-btn:active {
      transform: translateY(1px);
    }

    .action-btn.clear {
      margin-top: 22px;
      width: 220px;
    }

    @media (max-width: 700px) {
      .settings-panel {
        width: 92vw;
        padding: 24px 18px 20px;
      }

      .button-row {
        flex-direction: column;
        align-items: center;
      }

      .action-btn,
      .action-btn.clear {
        width: 100%;
        max-width: 280px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="settings-panel">
      <h1>Theme Settings</h1>

      <div class="label-text">Select your preferred theme:</div>

      <label for="themeSelect" style="position:absolute;left:-9999px;">Theme</label>
      <select id="themeSelect" aria-label="Choose theme">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>

      <div class="button-row">
        <button class="action-btn" type="button" id="saveLocalBtn">Save using localStorage</button>
        <button class="action-btn" type="button" id="saveSessionBtn">Save using sessionStorage</button>
      </div>

      <button class="action-btn clear" type="button" id="clearBtn">Clear Preferences</button>
    </div>
  </div>

  <script>
    const bodyEl = document.body;
    const themeSelect = document.getElementById('themeSelect');
    const saveLocalBtn = document.getElementById('saveLocalBtn');
    const saveSessionBtn = document.getElementById('saveSessionBtn');
    const clearBtn = document.getElementById('clearBtn');

    function applyTheme(theme) {
      const chosen = theme === 'dark' ? 'dark' : 'light';
      bodyEl.classList.toggle('dark-theme', chosen === 'dark');
      themeSelect.value = chosen;
    }

    function saveTheme(storageType) {
      const selectedTheme = themeSelect.value;
      if (storageType === 'local') {
        localStorage.setItem('themePreference', selectedTheme);
        sessionStorage.removeItem('themePreference');
      } else {
        sessionStorage.setItem('themePreference', selectedTheme);
        localStorage.removeItem('themePreference');
      }
      applyTheme(selectedTheme);
    }

    function clearPreferences() {
      localStorage.removeItem('themePreference');
      sessionStorage.removeItem('themePreference');
      applyTheme('light');
    }

    function initializeTheme() {
      const savedLocal = localStorage.getItem('themePreference');
      const savedSession = sessionStorage.getItem('themePreference');
      const initialTheme = savedLocal || savedSession || 'light';
      applyTheme(initialTheme);
    }

    themeSelect.addEventListener('change', function () {
      applyTheme(this.value);
    });

    saveLocalBtn.addEventListener('click', function () {
      saveTheme('local');
    });

    saveSessionBtn.addEventListener('click', function () {
      saveTheme('session');
    });

    clearBtn.addEventListener('click', clearPreferences);

    initializeTheme();
  </script>
</body>
</html>
